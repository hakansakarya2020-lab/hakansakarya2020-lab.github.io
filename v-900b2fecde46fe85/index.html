<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vaka Kitabı</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vaka Kitabı">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d6b78">
<style>
:root{--bg:#f5f7f8;--surface:#fff;--ink:#16232b;--muted:#5b6b75;--line:#d5dde2;--accent:#0d6b78;--bad:#b4322c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1619;--surface:#172126;--ink:#e4ecef;--muted:#93a4ad;--line:#2c3a41;--accent:#4fb8c4;--bad:#e07a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px env(safe-area-inset-bottom)}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
img{width:64px;height:64px;border-radius:14px;display:block;margin:0 auto 14px}
h1{font-size:22px;text-align:center;margin:0 0 4px}
p{color:var(--muted);margin:0 0 18px;text-align:center;font-size:15px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:17px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff}
button:disabled{opacity:.6}
#err{color:var(--bad);min-height:24px;margin-top:10px;text-align:center;font-size:15px}
#tip{display:none;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--muted)}
#tip b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="">
  <h1>Vaka Kitabı</h1>
  <p id="sub">Devam etmek için şifreyi girin. Bu telefonda bir kez sorulur.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go">Aç</button>
  </form>
  <div id="err"></div>
  <div id="tip">Uygulama gibi kullanmak için önce Safari'nin alt çubuğundaki <b>Paylaş</b> düğmesine (kare ve yukarı ok), sonra <b>Ana Ekrana Ekle</b>'ye dokunun. Ardından ana ekrandaki <b>Vaka Kitabı</b> simgesinden açıp şifreyi orada girin.</div>
</main>
<script src="keystore.js"></script>
<script>
(function () {
  // Everything happens in this page: decrypt the app, then replace this document with it.
  // The service worker only keeps copies of the (encrypted) files for offline use.
  var $ = function (id) { return document.getElementById(id); };
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone) $('tip').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function status(t) { $('err').style.color = 'var(--muted)'; $('err').textContent = t; }
  function fail(t) { $('err').style.color = ''; $('err').textContent = t; }

  var meta = null;
  async function getMeta() {
    if (meta) return meta;
    try { meta = await (await fetch('meta.json', { cache: 'no-cache' })).json(); localStorage.setItem('vaka-meta', JSON.stringify(meta)); }
    catch (e) { meta = JSON.parse(localStorage.getItem('vaka-meta') || 'null'); if (!meta) throw new Error('İnternete bağlanıp tekrar deneyin.'); }
    return meta;
  }
  async function bin(path, onProgress) {
    var c = null;
    try { c = await caches.open('vaka-data-' + meta.version); var hit = await c.match(path); if (hit) return hit.arrayBuffer(); } catch (_) {}
    var r = await fetch(path + '?v=' + meta.version);
    if (!r.ok) throw new Error('Dosya indirilemedi (' + r.status + ').');
    var total = +r.headers.get('content-length') || 0, buf;
    if (onProgress && r.body && total) {
      var rd = r.body.getReader(), parts = [], got = 0;
      for (;;) { var x = await rd.read(); if (x.done) break; parts.push(x.value); got += x.value.length; onProgress(got / total); }
      buf = await new Blob(parts).arrayBuffer();
    } else buf = await r.arrayBuffer();
    if (c) c.put(path, new Response(buf.slice(0))).catch(function () {});
    return buf;
  }

  async function start(key) {
    status('Uygulama indiriliyor…');
    var raw = await bin('data/app.bin', function (f) { status('Uygulama indiriliyor… %' + Math.round(f * 100)); });
    status('Açılıyor…');
    var html = new TextDecoder().decode(await vkGunzip(await vkDecrypt(key, raw)));
    var figCache = {};
    function fix(img) {
      var m = /^fig\/([A-Za-z0-9_-]+)\.jpg$/.exec(img.getAttribute('src') || '');
      if (!m) return;
      var id = m[1];
      img.removeAttribute('src');
      (figCache[id] || (figCache[id] = bin('data/fig/' + id + '.bin').then(function (b) { return vkDecrypt(key, b); }).then(function (d) { return URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })); })))
        .then(function (u) { img.src = u; }).catch(function () { delete figCache[id]; });
    }
    document.open(); document.write(html); document.close();
    var scan = function (n) { if (n.nodeType !== 1) return; if (n.tagName === 'IMG') fix(n); else n.querySelectorAll && n.querySelectorAll('img[src^="fig/"]').forEach(fix); };
    new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'attributes') fix(m.target); else m.addedNodes.forEach(scan); }); })
      .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
    scan(document.documentElement);
    if (navigator.serviceWorker) navigator.serviceWorker.ready.then(function (r) { r.active && r.active.postMessage({ type: 'precache' }); }).catch(function () {});
  }

  async function checkKey(key) {
    await getMeta();
    try { await vkDecrypt(key, b64(meta.check)); return true; } catch (_) { return false; }
  }

  (async function () {
    try {
      var key = await vkGet().catch(function () { return null; });
      if (key && await checkKey(key)) await start(key);
    } catch (e) { fail(e.message); }
  })();

  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    fail('');
    $('go').disabled = true; $('go').textContent = 'Kontrol ediliyor…';
    try {
      if (typeof DecompressionStream === 'undefined') throw new Error('iOS sürümü eski. Ayarlar > Genel > Yazılım Güncelleme ile iOS 16.4 veya üstüne güncelleyin.');
      await getMeta();
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value.trim()), 'PBKDF2', false, ['deriveBits']);
      var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(meta.salt), iterations: meta.iter }, base, 256);
      var key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
      if (!(await checkKey(key))) throw new Error('Şifre yanlış.');
      // Raw bytes are the fallback when a CryptoKey cannot be stored.
      try { await vkPut(key); } catch (_) { try { await vkPut(bits); } catch (__) {} }
      $('go').textContent = 'Açılıyor…';
      await start(key);
    } catch (e) {
      fail(e.message || String(e));
      $('go').disabled = false; $('go').textContent = 'Aç';
    }
  });
})();
</script>
</body>
</html>
